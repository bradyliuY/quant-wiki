<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 深蓝渐变背景 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2a63"/>
      <stop offset="55%" stop-color="#0c2f6e"/>
      <stop offset="100%" stop-color="#071d45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c46a"/>
      <stop offset="100%" stop-color="#b8892f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2565d6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 顶部光晕 -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 网格线（金融终端） -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- 金色K线：3组蜡烛 -->
  <g>
    <!-- 组1（左）上涨 -->
    <rect x="90" y="340" width="20" height="90" rx="3" fill="#e8c46a"/>
    <rect x="99" y="300" width="2" height="170" rx="1" fill="#d4a743"/>
    <!-- 组2 下跌 -->
    <rect x="170" y="300" width="20" height="70" rx="3" fill="#f5d98a"/>
    <rect x="179" y="280" width="2" height="110" rx="1" fill="#d4a743"/>
    <!-- 组3 上涨 -->
    <rect x="250" y="360" width="20" height="60" rx="3" fill="#e8c46a"/>
    <rect x="259" y="320" width="2" height="140" rx="1" fill="#d4a743"/>
  </g>

  <!-- 上升趋势线（金色） -->
  <polyline points="80,430 200,380 320,420 440,360" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 标题文字 -->
  <text x="80" y="120" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="2">量化交易知识库</text>
  <text x="80" y="180" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" fill="rgba(255,255,255,0.75)" letter-spacing="4">带动画的量化投资学习平台</text>

  <!-- 底部标签 -->
  <rect x="80" y="540" width="220" height="8" rx="4" fill="url(#gold)"/>
  <text x="80" y="590" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="rgba(255,255,255,0.5)" letter-spacing="1">策略 · 指标 · 方法论 · 回测</text>
</svg>
